<svg xmlns="http://www.w3.org/2000/svg" width="1731" height="909" viewBox="0 0 1731 909" role="img" aria-labelledby="title desc">
  <title id="title">2027年度 私立医学部 入試会場・周辺ホテル</title>
  <desc id="desc">全国31大学の一般選抜・共通テスト利用選抜の会場と宿泊ガイド</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f7efe2"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#960808"/>
      <stop offset="1" stop-color="#650000"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3b2416" flood-opacity="0.13"/>
    </filter>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#b58a22" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1731" height="909" fill="url(#paper)"/>
  <rect width="1731" height="18" fill="url(#wine)"/>
  <rect x="0" y="18" width="1731" height="8" fill="#d4af37"/>
  <rect x="1160" y="26" width="571" height="883" fill="url(#dots)"/>
  <circle cx="1625" cy="132" r="240" fill="none" stroke="#8b0000" stroke-width="60" opacity="0.035"/>

  <g font-family="'Yu Gothic', 'YuGothic', 'Meiryo', sans-serif">
    <g transform="translate(92 90)">
      <rect width="355" height="100" rx="12" fill="#fff" stroke="#8b0000" stroke-width="5"/>
      <rect x="12" y="12" width="331" height="76" rx="7" fill="#fff7df"/>
      <text x="37" y="68" fill="#8b0000" font-size="58" font-weight="900" letter-spacing="2">2027年度</text>
    </g>

    <text x="88" y="330" fill="#2b211b" font-size="116" font-weight="900" letter-spacing="-7">私立医学部</text>
    <text x="84" y="492" fill="#8b0000" font-size="126" font-weight="900" letter-spacing="-8">入試会場</text>
    <text x="646" y="492" fill="#b58a22" font-size="75" font-weight="900">・</text>
    <text x="712" y="492" fill="#8b0000" font-size="126" font-weight="900" letter-spacing="-8">ホテル</text>
    <rect x="91" y="535" width="895" height="8" rx="4" fill="#d4af37"/>

    <g transform="translate(86 596)">
      <rect width="948" height="108" rx="8" fill="url(#wine)"/>
      <rect x="0" y="0" width="18" height="108" rx="8" fill="#d4af37"/>
      <text x="48" y="69" fill="#ffffff" font-size="44" font-weight="800" letter-spacing="1">一般選抜・共通テスト利用｜全国31大学</text>
    </g>

    <text x="90" y="807" fill="#51463e" font-size="34" font-weight="800">正式会場と宿泊計画を、方式・一次／二次ごとに確認</text>
    <text x="90" y="858" fill="#8b0000" font-size="28" font-weight="900" letter-spacing="2">医学部予備校 レクサス E.C.</text>
  </g>

  <g transform="translate(1120 142)" filter="url(#shadow)">
    <rect x="0" y="0" width="510" height="626" rx="28" fill="#ffffff" stroke="#d9d1c7" stroke-width="5"/>
    <rect x="0" y="0" width="510" height="26" rx="13" fill="#8b0000"/>

    <g transform="translate(55 68)">
      <path d="M117 0C52 0 0 52 0 117c0 92 117 220 117 220s117-128 117-220C234 52 182 0 117 0Z" fill="#fff7df" stroke="#b58a22" stroke-width="10"/>
      <circle cx="117" cy="117" r="48" fill="#8b0000"/>
      <path d="M234 117h77c43 0 78 35 78 78v24" fill="none" stroke="#b58a22" stroke-width="10" stroke-linecap="round" stroke-dasharray="12 18"/>
      <circle cx="389" cy="235" r="13" fill="#b58a22"/>
    </g>

    <g transform="translate(182 318)">
      <rect x="0" y="74" width="236" height="174" rx="5" fill="#fff7df" stroke="#8b0000" stroke-width="9"/>
      <rect x="34" y="0" width="168" height="248" rx="5" fill="#ffffff" stroke="#8b0000" stroke-width="9"/>
      <path d="M76 248v-54h84v54" fill="#8b0000"/>
      <g fill="#b58a22">
        <rect x="66" y="42" width="34" height="34" rx="3"/>
        <rect x="135" y="42" width="34" height="34" rx="3"/>
        <rect x="66" y="102" width="34" height="34" rx="3"/>
        <rect x="135" y="102" width="34" height="34" rx="3"/>
      </g>
      <text x="118" y="177" text-anchor="middle" fill="#8b0000" font-family="Arial, sans-serif" font-size="37" font-weight="900">HOTEL</text>
    </g>

    <g font-family="'Yu Gothic', 'YuGothic', 'Meiryo', sans-serif" text-anchor="middle">
      <text x="255" y="592" fill="#51463e" font-size="29" font-weight="900" letter-spacing="3">VENUE &amp; STAY GUIDE</text>
    </g>
  </g>
</svg>
