<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-labelledby="title"><title id="title">2枚の平板ガラスの間の左右端に弾力のある板を挟み、上方から平面波を入射する装置の模式図。傾きや厚さは拡大・省略している。</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18334c"/></marker></defs><style>text{font-family:'Yu Gothic','Meiryo',sans-serif;font-size:20px;fill:#18334c;stroke:none}line,path,circle,ellipse,rect{vector-effect:non-scaling-stroke}.dash{stroke-dasharray:5 5}.glass{fill:#edf2f6}.small{font-size:17px}</style><rect width="100%" height="100%" fill="white"/><g stroke="#18334c" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><text x="295" y="34" >平面波</text><line x1="140" y1="56" x2="140" y2="122" marker-end="url(#arrow)" /><line x1="220" y1="56" x2="220" y2="122" marker-end="url(#arrow)" /><line x1="300" y1="56" x2="300" y2="122" marker-end="url(#arrow)" /><line x1="380" y1="56" x2="380" y2="122" marker-end="url(#arrow)" /><line x1="460" y1="56" x2="460" y2="122" marker-end="url(#arrow)" /><line x1="540" y1="56" x2="540" y2="122" marker-end="url(#arrow)" /><rect x="80" y="146" width="520" height="36" class="glass"/><rect x="80" y="207" width="520" height="36" class="glass"/><rect x="80" y="182" width="26" height="25" fill="#9aabb7"/><rect x="574" y="182" width="26" height="25" fill="#9aabb7"/><text x="73" y="274" >左</text><text x="578" y="274" >右</text></g></svg>