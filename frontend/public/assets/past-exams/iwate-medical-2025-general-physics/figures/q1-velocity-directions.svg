<svg xmlns="http://www.w3.org/2000/svg" width="600" height="385" viewBox="0 0 600 385" role="img" aria-labelledby="title"><title id="title">選択肢は上が①、左上②、左③、左下④、下⑤、右下⑥、右⑦、右上⑧。分離前の速度は上、地球の中心は左。</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18334c"/></marker></defs><style>text{font-family:'Yu Gothic','Meiryo',sans-serif;font-size:20px;fill:#18334c;stroke:none}line,path,circle,ellipse,rect{vector-effect:non-scaling-stroke}.dash{stroke-dasharray:5 5}.glass{fill:#edf2f6}.small{font-size:17px}</style><rect width="100%" height="100%" fill="white"/><g stroke="#18334c" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="300" y1="220" x2="300" y2="138" marker-end="url(#arrow)" /><text x="300" y="122" text-anchor="middle">①</text><line x1="300" y1="220" x2="242.01724394270312" y2="162.0172439427031" marker-end="url(#arrow)" /><text x="225.75378797541254" y="152.7537879754125" text-anchor="middle">②</text><line x1="300" y1="220" x2="218" y2="220" marker-end="url(#arrow)" /><text x="195" y="227" text-anchor="middle">③</text><line x1="300" y1="220" x2="242.01724394270312" y2="277.9827560572969" marker-end="url(#arrow)" /><text x="225.75378797541254" y="301.2462120245875" text-anchor="middle">④</text><line x1="300" y1="220" x2="300" y2="302" marker-end="url(#arrow)" /><text x="300" y="332" text-anchor="middle">⑤</text><line x1="300" y1="220" x2="357.9827560572969" y2="277.9827560572969" marker-end="url(#arrow)" /><text x="374.2462120245875" y="301.24621202458746" text-anchor="middle">⑥</text><line x1="300" y1="220" x2="382" y2="220" marker-end="url(#arrow)" /><text x="405" y="227" text-anchor="middle">⑦</text><line x1="300" y1="220" x2="357.9827560572969" y2="162.01724394270312" marker-end="url(#arrow)" /><text x="374.2462120245875" y="152.75378797541254" text-anchor="middle">⑧</text><line x1="300" y1="88" x2="300" y2="40" marke