<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="title"><title id="title">地球の中心を右側の焦点とするだ円軌道。近地点は中心から2R、遠地点は7R。</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18334c"/></marker></defs><style>text{font-family:'Yu Gothic','Meiryo',sans-serif;font-size:20px;fill:#18334c;stroke:none}line,path,circle,ellipse,rect{vector-effect:non-scaling-stroke}.dash{stroke-dasharray:5 5}.glass{fill:#edf2f6}.small{font-size:17px}</style><rect width="100%" height="100%" fill="white"/><g stroke="#18334c" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="310" cy="215" rx="202.5" ry="168.3746" class="dash"/><circle cx="422.5" cy="215" r="45" class="glass"/><circle cx="422.5" cy="215" r="2" fill="#18334c"/><line x1="107.5" y1="215" x2="422.5" y2="215" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line x1="422.5" y1="215" x2="512.5" y2="215" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="248" y="200" >7R</text><text x="470" y="200" >2R</text><text x="402" y="240" >地球</text><text x="76" y="250" >遠地点</text><text x="506" y="250" >近地点</text></g></svg>