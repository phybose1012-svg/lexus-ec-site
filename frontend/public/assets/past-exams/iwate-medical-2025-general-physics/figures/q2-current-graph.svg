<svg xmlns="http://www.w3.org/2000/svg" width="640" height="345" viewBox="0 0 640 345" role="img" aria-labelledby="title"><title id="title">電流iは0からTまで−i0、Tから3Tまで0、3Tから4Tまでi0、4Tより後は0。</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18334c"/></marker></defs><style>text{font-family:'Yu Gothic','Meiryo',sans-serif;font-size:20px;fill:#18334c;stroke:none}line,path,circle,ellipse,rect{vector-effect:non-scaling-stroke}.dash{stroke-dasharray:5 5}.glass{fill:#edf2f6}.small{font-size:17px}</style><rect width="100%" height="100%" fill="white"/><g stroke="#18334c" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="44" y1="175" x2="589" y2="175" marker-end="url(#arrow)" /><line x1="70" y1="305" x2="70" y2="28" marker-end="url(#arrow)" /><text x="601" y="182" >t</text><text x="54" y="20" >i</text><text x="46" y="195" >0</text><line x1="70" y1="80" x2="430" y2="80" class="dash"/><line x1="160" y1="175" x2="160" y2="270" class="dash"/><line x1="340" y1="80" x2="340" y2="175" class="dash"/><line x1="430" y1="80" x2="430" y2="175" class="dash"/><line x1="70" y1="270" x2="160" y2="270" stroke-width="3"/><line x1="160" y1="175" x2="340" y2="175" stroke-width="3"/><line x1="340" y1="80" x2="430" y2="80" stroke-width="3"/><line x1="430" y1="175" x2="560" y2="175" stroke-width="3"/><text x="35" y="86" >i₀</text><text x="21" y="277" >−i₀</text><text x="153" y="203" >T</text><text x="327" y="203" >3T</text><text x="417" y="203" >4T</text></g></svg>