<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title"><title id="title">光軸を一致させて接触するレンズの断面。上は下面が凸の平凸レンズ、下は上面が凹の平凹レンズ。中心で接触し、周辺には隙間がある。</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18334c"/></marker></defs><style>text{font-family:'Yu Gothic','Meiryo',sans-serif;font-size:20px;fill:#18334c;stroke:none}line,path,circle,ellipse,rect{vector-effect:non-scaling-stroke}.dash{stroke-dasharray:5 5}.glass{fill:#edf2f6}.small{font-size:17px}</style><rect width="100%" height="100%" fill="white"/><g stroke="#18334c" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M90 170 A450 450 0 0 0 630 170 V300 H90 Z" class="glass"/><path d="M170 160 H550 A230.5 230.5 0 0 1 170 160 Z" class="glass"/><line x1="360" y1="43" x2="360" y2="345" class="dash"/><text x="340" y="28" >光軸</text><text x="496" y="111" >平凸レンズ</text><line x1="535" y1="119" x2="522" y2="163" /><text x="504" y="355" >平凹レンズ</text><line x1="542" y1="331" x2="542" y2="283" /></g></svg>